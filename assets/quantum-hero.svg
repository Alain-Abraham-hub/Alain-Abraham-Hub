<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none">
  <defs>
    <!-- Deep Space-Slate Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#161B2E" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glowing Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#70A5FD" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Wavefunction Gradients -->
    <linearGradient id="waveCyan" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#70A5FD" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveViolet" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0" />
      <stop offset="35%" stop-color="#BF91F3" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#38BDAE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="qubitCore" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7C3AED" />
    </radialGradient>

    <!-- Subtle Background Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="238" rx="16" />
    </clipPath>
  </defs>

  <!-- Main Card Base -->
  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Clipped Interior Visuals -->
  <g clip-path="url(#cardClip)">
    <!-- Background Grid -->
    <rect x="1" y="1" width="898" height="238" fill="url(#grid)" />

    <!-- Ambient Glow Halos -->
    <circle cx="140" cy="50" r="190" fill="url(#glowCyan)" />
    <circle cx="755" cy="125" r="185" fill="url(#glowViolet)" />

    <!-- Animated Wavefunction Paths -->
    <path
      d="M -20 182 Q 85 138, 190 182 T 400 182 T 610 182 T 820 182 T 960 182"
      stroke="url(#waveCyan)"
      stroke-width="1.8"
      stroke-dasharray="10 6"
      fill="none"
    >
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="4.5s" repeatCount="indefinite" />
    </path>

    <path
      d="M -20 194 Q 95 232, 210 194 T 440 194 T 670 194 T 900 194"
      stroke="url(#waveViolet)"
      stroke-width="1.5"
      stroke-dasharray="8 8"
      fill="none"
    >
      <animate attributeName="stroke-dashoffset" from="0" to="64" dur="5.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="5.2s" repeatCount="indefinite" />
    </path>

    <!-- Left Edge Decorative Quantum Circuit Motifs -->
    <g opacity="0.22" stroke="#38BDF8" stroke-width="1.2">
      <!-- Qubit Wires -->
      <line x1="22" y1="62" x2="175" y2="62" />
      <line x1="22" y1="98" x2="175" y2="98" />
      <line x1="22" y1="134" x2="128" y2="134" />

      <!-- Ket Labels -->
      <text x="14" y="54" fill="#38BDF8" stroke="none" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11">|ψ⟩</text>
      <text x="14" y="90" fill="#BF91F3" stroke="none" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11">|0⟩</text>

      <!-- Hadamard Gate Box -->
      <rect x="46" y="50" width="24" height="24" rx="4" fill="#0B0F19" stroke="#38BDF8" />
      <text x="58" y="66" fill="#38BDF8" stroke="none" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">H</text>

      <!-- CNOT Gate (Control Dot + Target Plus) -->
      <line x1="106" y1="62" x2="106" y2="98" stroke="#A855F7" />
      <circle cx="106" cy="62" r="4" fill="#A855F7" stroke="none" />
      <circle cx="106" cy="98" r="9" fill="#0B0F19" stroke="#A855F7" />
      <line x1="100" y1="98" x2="112" y2="98" stroke="#A855F7" />
      <line x1="106" y1="92" x2="106" y2="104" stroke="#A855F7" />

      <!-- Rotation Gate Rz -->
      <rect x="136" y="86" width="26" height="24" rx="4" fill="#0B0F19" stroke="#38BDAE" />
      <text x="149" y="102" fill="#38BDAE" stroke="none" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Rz</text>
    </g>

    <!-- Right Side Bloch Sphere / Orbital Rings Emblem -->
    <g transform="translate(755, 118)">
      <!-- Outer Subtle Halo Ring -->
      <circle cx="0" cy="0" r="76" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.2" stroke-dasharray="4 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite" />
      </circle>

      <!-- Bloch Sphere Boundary -->
      <circle cx="0" cy="0" r="56" stroke="#70A5FD" stroke-width="1.4" stroke-opacity="0.45" fill="#0F172A" fill-opacity="0.35" />

      <!-- Basis Axes (Z and X/Y) -->
      <line x1="0" y1="-64" x2="0" y2="64" stroke="#94A3B8" stroke-width="0.9" stroke-opacity="0.35" stroke-dasharray="3 3" />
      <line x1="-64" y1="0" x2="64" y2="0" stroke="#94A3B8" stroke-width="0.9" stroke-opacity="0.35" stroke-dasharray="3 3" />
      <text x="0" y="-68" fill="#38BDF8" fill-opacity="0.7" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">|0⟩</text>
      <text x="0" y="77" fill="#BF91F3" fill-opacity="0.7" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">|1⟩</text>

      <!-- Equatorial & Tilted Orbital Rings -->
      <ellipse cx="0" cy="0" rx="56" ry="18" stroke="#38BDF8" stroke-width="1.3" stroke-opacity="0.65" fill="none" />
      <ellipse cx="0" cy="0" rx="56" ry="18" stroke="#A855F7" stroke-width="1.3" stroke-opacity="0.6" fill="none" transform="rotate(55)" />
      <ellipse cx="0" cy="0" rx="56" ry="18" stroke="#38BDAE" stroke-width="1.2" stroke-opacity="0.55" fill="none" transform="rotate(-55)" />

      <!-- State Vector |ψ⟩ Arrow -->
      <line x1="0" y1="0" x2="31" y2="-37" stroke="#F8FAFC" stroke-width="1.6" stroke-opacity="0.9" filter="url(#softGlow)" />
      <circle cx="31" cy="-37" r="4" fill="#38BDF8" filter="url(#softGlow)">
        <animate attributeName="r" values="3.5;5;3.5" dur="2.6s" repeatCount="indefinite" />
      </circle>

      <!-- Central Glowing Qubit Core -->
      <circle cx="0" cy="0" r="10" fill="url(#qubitCore)" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" />
      </circle>

      <!-- Orbiting Quantum Node Dots -->
      <circle cx="-56" cy="0" r="3" fill="#38BDF8" opacity="0.85">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="56" cy="0" r="3" fill="#A855F7" opacity="0.85">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Bottom-Right Faint Quantum Circuit Wire Accent -->
    <g opacity="0.18" stroke="#BF91F3" stroke-width="1.2">
      <line x1="650" y1="208" x2="878" y2="208" />
      <rect x="815" y="196" width="24" height="24" rx="4" fill="#0B0F19" stroke="#BF91F3" />
      <path d="M 821 213 A 6 6 0 0 1 833 213" fill="none" stroke="#BF91F3" />
      <line x1="827" y1="213" x2="832" y2="203" stroke="#BF91F3" />
    </g>

    <!-- Main Typography Block -->
    <g transform="translate(88, 52)">
      <!-- Top Monospace Pill Tag -->
      <rect x="0" y="0" width="424" height="28" rx="14" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.45" />
      <text
        x="212"
        y="18"
        fill="#38BDF8"
        font-family="'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11.5"
        font-weight="600"
        letter-spacing="0.8"
        text-anchor="middle"
      >⟨ψ| QUANTUM COMPUTING × MACHINE LEARNING |ψ⟩</text>

      <!-- Main Heading -->
      <text
        x="0"
        y="84"
        fill="#F8FAFC"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="44"
        font-weight="800"
        letter-spacing="-0.5"
      >Alain Abraham</text>

      <!-- Subtitle -->
      <text
        x="2"
        y="116"
        fill="#94A3B8"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="15.5"
        font-weight="500"
      >Quantum Algorithms  •  Variational Circuits (VQE / SQD / QAOA)  •  Quantum ML</text>
    </g>
  </g>
</svg>
