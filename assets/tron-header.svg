<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="70%" stop-color="#020a10" />
      <stop offset="100%" stop-color="#03141c" />
    </linearGradient>

    <linearGradient id="floorFade" x1="0" y1="190" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FF3FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6FF3FF" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="horizonFade" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FF3FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#6FF3FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#6FF3FF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="scanFade" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FF3FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#6FF3FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6FF3FF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="horizonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6FF3FF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#6FF3FF" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b1" />
      <feGaussianBlur stdDeviation="1.5" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="floor">
      <rect x="0" y="190" width="1000" height="110" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#sky)" />

  <!-- Subtle HUD scanline -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#scanFade)" stroke-width="1.5">
    <animate attributeName="y1" from="0" to="300" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" from="0" to="300" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Horizon glow -->
  <ellipse cx="500" cy="190" rx="520" ry="70" fill="url(#horizonGlow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite" />
  </ellipse>

  <!-- Perspective grid floor -->
  <g clip-path="url(#floor)" stroke="url(#floorFade)" stroke-width="1" fill="none">
    <line x1="500" y1="190" x2="-2500" y2="300" />
    <line x1="500" y1="190" x2="-1900" y2="300" />
    <line x1="500" y1="190" x2="-1300" y2="300" />
    <line x1="500" y1="190" x2="-800" y2="300" />
    <line x1="500" y1="190" x2="-400" y2="300" />
    <line x1="500" y1="190" x2="-80" y2="300" />
    <line x1="500" y1="190" x2="190" y2="300" />
    <line x1="500" y1="190" x2="400" y2="300" />
    <line x1="500" y1="190" x2="600" y2="300" />
    <line x1="500" y1="190" x2="810" y2="300" />
    <line x1="500" y1="190" x2="1080" y2="300" />
    <line x1="500" y1="190" x2="1400" y2="300" />
    <line x1="500" y1="190" x2="1800" y2="300" />
    <line x1="500" y1="190" x2="2300" y2="300" />
    <line x1="500" y1="190" x2="2900" y2="300" />
    <line x1="500" y1="190" x2="3500" y2="300" />

    <!-- Animated flowing depth lines -->
    <line x1="0" y1="190" x2="1000" y2="190">
      <animate attributeName="y1" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="y2" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;1;1" dur="3.6s" begin="0s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="190" x2="1000" y2="190">
      <animate attributeName="y1" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-0.6s" repeatCount="indefinite" />
      <animate attributeName="y2" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;1;1" dur="3.6s" begin="-0.6s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="190" x2="1000" y2="190">
      <animate attributeName="y1" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-1.2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;1;1" dur="3.6s" begin="-1.2s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="190" x2="1000" y2="190">
      <animate attributeName="y1" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-1.8s" repeatCount="indefinite" />
      <animate attributeName="y2" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;1;1" dur="3.6s" begin="-1.8s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="190" x2="1000" y2="190">
      <animate attributeName="y1" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-2.4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;1;1" dur="3.6s" begin="-2.4s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="190" x2="1000" y2="190">
      <animate attributeName="y1" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-3.0s" repeatCount="indefinite" />
      <animate attributeName="y2" values="190;198;228;300" keyTimes="0;0.4;0.75;1" dur="3.6s" begin="-3.0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;1;1" dur="3.6s" begin="-3.0s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Horizon line -->
  <line x1="0" y1="190" x2="1000" y2="190" stroke="url(#horizonFade)" stroke-width="1.6" filter="url(#softGlow)" />

  <!-- Light cycle trails -->
  <line x1="0" y1="254" x2="1000" y2="254" stroke="#6FF3FF" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="180 820" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" from="180" to="-820" dur="3.6s" repeatCount="indefinite" />
  </line>
  <line x1="0" y1="219" x2="1000" y2="219" stroke="#FF9A3C" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="140 860" filter="url(#softGlow)" opacity="0.95">
    <animate attributeName="stroke-dashoffset" from="-860" to="140" dur="4.4s" repeatCount="indefinite" />
  </line>
  <line x1="0" y1="281" x2="1000" y2="281" stroke="#6FF3FF" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="120 880" filter="url(#softGlow)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="-880" to="120" dur="3s" begin="-1.2s" repeatCount="indefinite" />
  </line>

  <!-- HUD corner brackets -->
  <g stroke="#6FF3FF" stroke-width="1.5" fill="none">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3.5s" repeatCount="indefinite" />
    <path d="M 24 44 L 24 24 L 64 24" />
    <path d="M 936 24 L 976 24 L 976 44" />
    <path d="M 24 256 L 24 276 L 64 276" />
    <path d="M 936 276 L 976 276 L 976 256" />
  </g>

  <!-- HUD micro labels -->
  <g font-family="'Courier New', Menlo, monospace" font-size="10" fill="#6FF3FF" letter-spacing="2">
    <text x="76" y="28" opacity="0.6">SYS.USER // ALAIN-ABRAHAM-HUB</text>
    <circle cx="836" cy="24.5" r="3" fill="#6FF3FF" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="924" y="28" text-anchor="end" opacity="0.7">GRID ONLINE</text>
  </g>

  <!-- Name -->
  <text x="507" y="112" text-anchor="middle"
        font-family="'Eurostile', 'Bank Gothic', 'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="14"
        fill="#E8FDFF" stroke="#6FF3FF" stroke-width="0.6" filter="url(#glow)">ALAIN ABRAHAM</text>

  <!-- Divider -->
  <line x1="330" y1="132" x2="670" y2="132" stroke="url(#horizonFade)" stroke-width="1.2" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Subtitle -->
  <text x="503" y="158" text-anchor="middle"
        font-family="'Courier New', Menlo, monospace" font-size="14" letter-spacing="6"
        fill="#6FF3FF">BUILDING QUANTUM ALGORITHMS</text>
</svg>
