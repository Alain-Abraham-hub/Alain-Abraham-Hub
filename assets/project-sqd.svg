<svg xmlns="http://www.w3.org/2000/svg" width="480" height="175" viewBox="0 0 480 175">
  <defs>
    <filter id="glow" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6FF3FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6FF3FF" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="476" height="171" fill="#000000" stroke="#6FF3FF" stroke-width="1" stroke-opacity="0.35" />

  <!-- Corner HUD brackets -->
  <g stroke="#6FF3FF" stroke-width="1.8" fill="none" filter="url(#glow)">
    <path d="M 2 20 L 2 2 L 24 2" />
    <path d="M 456 2 L 478 2 L 478 20" />
    <path d="M 2 155 L 2 173 L 24 173" />
    <path d="M 456 173 L 478 173 L 478 155" />
  </g>

  <!-- Header bar -->
  <text x="24" y="30" font-family="'Courier New', Menlo, monospace" font-size="11" letter-spacing="2" fill="#6FF3FF">02 // DIAGONALIZATION</text>
  <text x="456" y="30" text-anchor="end" font-family="'Courier New', Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#6FF3FF" opacity="0.65">OPEN SOURCE</text>
  <line x1="24" y1="40" x2="456" y2="40" stroke="url(#topBar)" stroke-width="1" />

  <!-- Title -->
  <text x="24" y="70" font-family="'Eurostile', 'Bank Gothic', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2" fill="#E8FDFF" filter="url(#glow)">SQD Algorithm Ground State</text>

  <!-- Description -->
  <text x="24" y="98" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A5C4CA">Sample-based Quantum Diagonalization (SQD) subspace</text>
  <text x="24" y="117" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A5C4CA">projection for accurate molecular ground states.</text>

  <!-- Footer stack -->
  <line x1="24" y1="136" x2="456" y2="136" stroke="#6FF3FF" stroke-width="0.6" stroke-opacity="0.25" />
  <text x="24" y="156" font-family="'Courier New', Menlo, monospace" font-size="11" letter-spacing="1.2" fill="#6FF3FF">QISKIT  |  PYTHON  |  SUBSPACE METHODS</text>
</svg>
